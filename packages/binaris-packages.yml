notes: >-
  Binaris shipped a first-party Node.js SDK/CLI ("binaris", providing the `bn`
  command) plus a scoped @binaris runtime package and an official Docker image of
  the CLI. The FaaS product itself is now defunct (binaris.io / binaris.com no
  longer serve the platform), but the published client artifacts remain on the
  public registries and are captured here verbatim. Registries probed with no
  first-party hit: PyPI, Maven Central, NuGet, pkg.go.dev, RubyGems, Packagist,
  crates.io.
